name: Jadwal Shalat
on:
  schedule:
  - cron: '00 20 * * *'
  workflow_dispatch:


jobs:
  push2db-send2tele:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install psycopg2-binary==2.9.10 pytz==2025.2 requests==2.32.4

    - name: Run push2db-send2tele.py
      env:
        NEONDB_URI: 'postgresql://muhidin_owner:npg_X3en6QuhxJDi@ep-jolly-cake-a1cwqxx2-pooler.ap-southeast-1.aws.neon.tech/muhidin?sslmode=require'
        TELEGRAM_URI: 'http://muhammadmuhidin.pythonanywhere.com/send2tele'
      run: python push2db-send2tele.py

  docker-compose-up-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Setup Docker Compose
      uses: docker/setup-compose-action@v1

    - name: Build and run Docker Compose
      env:
        NEON_HOST: 'ep-jolly-cake-a1cwqxx2-pooler.ap-southeast-1.aws.neon.tech'
        NEON_USERNAME: 'muhidin_owner'
        NEON_PASSWORD: 'npg_X3en6QuhxJDi'
        NEON_DATABASE: 'muhidin'
      run: docker compose -f docker-compose.yml up --build 

    - name: Docker Compose Down
      run: docker compose -f docker-compose.yml down
    
