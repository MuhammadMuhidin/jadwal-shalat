  docker-compose-up-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: setup docker
      uses: docker/setup-buildx-action@v3

    - name: setup docker compose
      uses: docker/setup-compose-action@v2

    - name: compose up --build
