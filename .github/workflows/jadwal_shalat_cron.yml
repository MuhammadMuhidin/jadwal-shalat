name: Jadwal Shalat

on:
  schedule:
  - cron: "*/10 * * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: action/checkout@v3
    
    - name: setup python
      uses: action/checkout@v4
      with:
        python-version: '3.10'

    - name: install depedencies
      run: pip install psycopg2-binary==2.9.10 pytz==2025.2 requests==2.32.4

    - name: jalankan script main.py
      run: python main.py
    
