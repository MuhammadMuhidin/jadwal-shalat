name: Jadwal Shalat & Push Data Traffic
on:
  push:
    branches:
      - main
  schedule:
  - cron: '0 23,2,5,8,11,14,17,20 * * *'
  workflow_dispatch:


jobs:
  run-scripts:
    runs-on: ubuntu-latest
    environment: jadwal_shalat
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install psycopg2-binary==2.9.10 pytz==2025.2 requests==2.32.4 Faker==37.4.0

    - name: Run both scripts if 20:00 UTC else run weather.py
      env:
        NEONDB_URI: ${{ secrets.NEONDB_URI }}
        NEONDB_URI_DR: ${{ secrets.NEONDB_URI_DR }}
        TELEGRAM_URI: ${{ secrets.TELEGRAM_URI }}
      run: |
        current_hour=$(date -u +"%H")
        if [ "$current_hour" -eq 20 ]; then
            echo "running all scripts"
            python push2db-traffic.py
            python push2db-send2tele.py
        else
            echo "running weather only"
            python weather.py
        fi
