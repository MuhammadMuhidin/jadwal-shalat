name: Jadwal Shalat & Push Data Traffic
on:
  push:
    branches:
      - main
  schedule:
  - cron: '00 20 * * *'
  workflow_dispatch:


jobs:
  run-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install psycopg2-binary==2.9.10 pytz==2025.2 requests==2.32.4 Faker==37.4.0

    - name: Run both scripts
      env:
        NEONDB_URI: ${{ secrets.NEONDB_URI }}
        TELEGRAM_URI: 'http://muhammadmuhidin.pythonanywhere.com/send2tele'
      run: |
        python push2db-traffic.py
        python push2db-send2tele.py
